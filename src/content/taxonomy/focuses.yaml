# --- Field ground balls cleanly ---
- id: not-getting-low
  label: Not getting low
  kind: fix
  areas: [ground-balls]
  signs: Balls go under the glove or between the legs; the fielder bends at the waist instead of the knees.
- id: stabbing
  label: Stabbing at the ball
  kind: fix
  areas: [ground-balls]
  signs: The glove starts high and jabs down at the last second, so balls bounce off the heel of the glove.
- id: backhand
  label: Backhand trouble
  kind: fix
  areas: [ground-balls]
- id: footwork-to-throw
  label: Footwork into the throw
  kind: build
  areas: [ground-balls]
- id: first-step
  label: Quicker first step
  kind: build
  areas: [ground-balls, get-faster]
- id: double-plays
  label: Double plays
  kind: build
  areas: [ground-balls]

