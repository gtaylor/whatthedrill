# The specific things inside an area. Drills are tagged with these and nothing
# else; areas and categories are worked out from them.
#   kind: fix   = something going wrong (shown under "What's happening?")
#   kind: build = something to develop (shown under "What to build")
# A focus can sit under more than one area.

# --- Make better contact ---
- id: swinging-and-missing
  label: Swinging and missing
  kind: fix
  areas: [make-contact]
- id: rolling-over
  label: Rolling over
  kind: fix
  areas: [make-contact]
  signs: Weak ground balls to the pull side; the top hand flips over at contact.
- id: popping-up
  label: Popping up
  kind: fix
  areas: [make-contact]
- id: long-swing
  label: Long, loopy swing
  kind: fix
  areas: [make-contact]
  signs: The hands push away from the body early ("casting") and the bat takes a wide path to the ball.
- id: eyes-off-ball
  label: Eyes off the ball
  kind: fix
  areas: [make-contact]
- id: stepping-in-bucket
  label: Stepping in the bucket
  kind: fix
  areas: [make-contact]
- id: dropping-hands
  label: Dropping the hands
  kind: fix
  areas: [make-contact]

